# Worker en la nube: procesa la cola (capas, GPS, informes, figuras) sin depender de una PC encendida.
# Lo dispara la base al entrar un trabajo (migración 0025, workflow_dispatch) y, de respaldo, cada 15 minutos.
# Corre adentro de la imagen del worker (workflow "Imagen del worker"), que ya trae LibreOffice, GPSBabel, fuentes y las
# dependencias de Python: no instala nada en cada corrida y arranca en segundos.
# Secreto requerido: SUPABASE_SERVICE_ROLE_KEY. Variable: NEXT_PUBLIC_SUPABASE_URL (la misma que usa la web).
name: Worker (cola de trabajos)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

# una sola pasada a la vez: una nueva espera a la que está corriendo (claim_job igual evita pisarse)
concurrency:
  group: worker-cola
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  procesar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository_owner }}/eia-worker:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas disponibles
        run: soffice --version && gpsbabel -V

      - name: Procesar la cola
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m app.run_once
